# DMDR-style joint DMD regularization + reward optimization for Wan 2.1 T2V 1.3B.
#
# This first recipe mirrors the single-frame DiffusionNFT setup while adding a
# frozen teacher and trainable fake-score critic for distribution matching.
# It is a FastVideo-native baseline, not a full reproduction of the public SiT
# DMDR recipe's dynamic distribution guidance or dynamic re-noise schedule.

models:
  student:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    trainable: true
  old:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    trainable: false
    disable_custom_init_weights: true
  reference:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    trainable: false
    disable_custom_init_weights: true
  teacher:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    trainable: false
    disable_custom_init_weights: true
  critic:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: Wan-AI/Wan2.1-T2V-1.3B-Diffusers
    trainable: true

method:
  _target_: fastvideo.train.methods.rl.dmdr.DMDRMethod
  reward_fn:
    pickscore: 1.0
    clipscore: 1.0

  sampling:
    num_steps: 25
    scheduler: flow_match_euler
    trajectory: ode
    flow_shift: inherit

  validation:
    every_steps: 10
    num_steps: 40
    num_prompts: 16
    batch_size: 16
    log_samples: true
    seed: 42
    data_path:

  sample_train_batch_size: 6
  train_batch_size: 6
  num_batches_per_epoch: 48
  num_video_per_prompt: 24
  num_inner_epochs: 1
  timestep_fraction: 0.99
  cold_start_steps: 0
  dynamic_step: 10000
  guidance_update_ratio: 5
  gen_timestep_sampling:
    type: uniform
    alpha: 1.0
    beta: 1.0
    discrete: true
  dmd_timestep_sampling:
    type: logit_normal
    alpha: 4.0
    beta: 1.5
  fake_score_timestep_sampling:
    type: logit_normal
    alpha: 4.0
    beta: 1.5

  rl_loss_weight: 1.0
  dmd_loss_weight: 1.0
  fake_score_loss_weight: 1.0
  real_score_guidance_scale: 1.0
  cfg_uncond:
    text: zero
    on_missing: ignore
  fake_score_learning_rate: 1.0e-5
  fake_score_betas: [0.0, 0.999]
  fake_score_lr_scheduler: constant
  fake_score_max_grad_norm: 1.0

  beta: 0.1
  kl_beta: 0.0001
  decay_type: 1
  adv_mode: all
  adv_clip_max: 5
  max_grad_norm: 1.0
  ema:
    enabled: true
    decay: 0.9
    update_after_step: 0
    validation: true
  terminal_progress: true

training:
  distributed:
    num_gpus: 4
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 4

  data:
    data_path: data/pickscore_text_only_preprocessed
    preprocessed_data_type: text_only
    dataloader_num_workers: 0
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 42
    num_latent_t: 1
    num_height: 448
    num_width: 832
    num_frames: 1

  optimizer:
    learning_rate: 3.0e-5
    betas: [0.9, 0.999]
    weight_decay: 0.0001
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 100000
    gradient_accumulation_steps: 48

  checkpoint:
    output_dir: outputs/wan2.1_dmdr_pick_clip
    training_state_checkpointing_steps: 30
    checkpoints_total_limit: 3

  tracker:
    project_name: dmdr_wan
    run_name: wan2.1_dmdr_pick_clip

  model:
    enable_gradient_checkpointing_type: full

pipeline:
  flow_shift: 8
