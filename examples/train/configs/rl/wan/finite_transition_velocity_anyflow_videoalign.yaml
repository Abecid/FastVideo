# Posterior-mean finite-velocity regression on deployed AnyFlow transitions.
#
# This is the distinct follow-up when likelihood-based FTPP remains tied with
# GRPO. Reward changes the deterministic finite-velocity target itself rather
# than only weighting an auxiliary stochastic-policy log likelihood.

models:
  student:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: nvidia/AnyFlow-Wan2.1-T2V-1.3B-Diffusers
    trainable: true
    flow_shift: 5.0
    lora:
      enable: true
      rank: 64
      alpha: 128
      target_modules:
        - to_q
        - to_k
        - to_v
        - to_out
        - ffn.fc_in
        - ffn.fc_out

method:
  _target_: fastvideo.train.methods.rl.finite_transition_reliable_audited.AuditedReliableFiniteTransitionMethod
  objective: finite_velocity_regression

  # Reward-correct exactly the deterministic transition pairs used by four-step
  # deployment. One transition is selected per prompt group; the suffix remains
  # deterministic and supplies terminal reward.
  require_train_eval_schedule_match: true
  train_map_steps: 4
  eval_map_steps: 4
  stochastic_steps: 3
  rollout_mode: single_transition
  transition_loss_reduction: mean

  group_size: 8
  rollout_groups_per_update: 4

  anchor_type: local
  local_anchor_delta: 0.03
  local_noise_scale: 0.7
  local_terminal_base_sigma: 0.05
  flow_shift: 5.0
  attn_kind: dense

  reward_normalization: running_prompt_global
  running_reward_stats:
    min_prompt_count: 4
    min_global_count: 32
    epsilon: 0.0001
    clip: 5.0
  posterior_temperature_mode: global_std
  posterior_temperature_scale: 1.0
  target_ess_ratio: 0.50
  reward_bisection_steps: 40

  # Fixed base behavior makes candidate actions and rewards identical across
  # independently launched objective arms and provides a frozen reference
  # velocity for the regression target.
  behavior_policy: base_adapter_disabled

  finite_velocity_target_rms: 0.002
  finite_velocity_max_eta: 4.0
  transfer_probe_every: 1
  max_grad_norm: 1.0
  terminal_progress: true

  # The finite-velocity target already has an explicit RMS trust region. Keep
  # the policy-KL controller disabled for this objective.
  target_kl_controller:
    enabled: false
    target_kl: 0.00001
    initial_loss_scale: 1.0
    min_loss_scale: 0.05
    max_loss_scale: 16.0
    max_adjustment: 2.0

  reward_backend: genrl
  optimize_reward: videoalign_mq_audited
  reward_fn:
    rewards:
      videoalign_mq_audited: 1.0
  validation_reward_backend: genrl
  validation_reward_fn:
    rewards:
      videoalign_mq_audited: 1.0
      videoalign_vq_audited: 1.0
      videoalign_ta_audited: 1.0

  validation:
    every_steps: 25
    num_steps: 4
    num_prompts: 64
    batch_size: 1
    log_samples: true
    max_samples: 8
    fps: 16
    seed: 42
    data_path:

  paired_validation:
    bootstrap_samples: 4000
    confidence: 0.95

  evaluation:
    samples_per_prompt: 2
    static_temporal_l1_threshold: 0.01
    primary_min_delta: 0.02
    significance_z: 1.96
    min_motion_ratio: 0.90
    min_latent_diversity_ratio: 0.80
    heldout_max_drop:
      videoalign_vq_audited: 0.02
      videoalign_ta_audited: 0.02

  ema:
    enabled: true
    decay: 0.90
    update_after_step: 0
    validation: true

training:
  distributed:
    num_gpus: 4
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 4

  data:
    data_path: data/finite_transition_velocity/train/combined_parquet_dataset
    preprocessed_data_type: text_only
    dataloader_num_workers: 0
    train_batch_size: 2
    training_cfg_rate: 0.0
    seed: 42
    num_latent_t: 21
    num_height: 480
    num_width: 832
    num_frames: 81

  optimizer:
    learning_rate: 0.00001
    betas: [0.9, 0.999]
    weight_decay: 0.0001
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    max_train_steps: 100
    gradient_accumulation_steps: 1

  checkpoint:
    output_dir: outputs/wan_anyflow_finite_transition_velocity
    training_state_checkpointing_steps: 25
    checkpoints_total_limit: 4
    resume_from_checkpoint:

  tracker:
    entity: adamlee00
    project_name: finite-transition-reliable-wan
    run_name: anyflow_finite_velocity_videoalign_mq

  model:
    enable_gradient_checkpointing_type: full

pipeline:
  flow_shift: 5.0
  dit_config:
    r_embedder: true
    r_embedder_fusion: gated
    r_embedder_gate_value: 0.25
    r_embedder_deltatime_type: r
