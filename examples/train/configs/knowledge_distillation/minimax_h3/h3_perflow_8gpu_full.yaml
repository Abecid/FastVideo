# One deterministic pass over a 100-prompt x top-2 x 4-segment PeRFlow view.
# SP4 x DP2 consumes the 800 selected segment examples in 400 optimizer steps.
models:
  student:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3PeRFlowModel
    init_from: artifacts/rvm_h3/models/fasth3
    trainable: true
    enable_gradient_checkpointing_type: full
    attention_backend: VIDEO_SPARSE_ATTN_H3
    student_timesteps: [1000, 750, 500, 250, 0]
    verify_cache_hashes: false
    selected_per_prompt: 2
    ranking_key: mixed_advantage
    lora:
      enable: true
      rank: 128
      # Match every production RVM config for function-preserving continuation.
      alpha: 64
      target_modules: [to_q, to_k, to_v, to_out]

method:
  _target_: fastvideo.train.methods.knowledge_distillation.H3PeRFlowMethod
  attn_kind: vsa
  loss_type: mse
  huber_delta: 1.0
  audio_loss_weight: 1.0
  function_anchor_weight: 0.0
  sigma_eps: 1.0e-8
  interpolation_tolerance: 1.0e-5

training:
  distributed:
    num_gpus: 8
    sp_size: 4
    tp_size: 1
    hsdp_replicate_dim: 2
    hsdp_shard_dim: 4
  data:
    data_path: artifacts/rvm_h3/rest_cache/full
    preprocessed_data_type: text_only
    dataloader_num_workers: 2
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 42
    num_latent_t: 37
    num_height: 480
    num_width: 832
    num_frames: 124
  optimizer:
    learning_rate: 1.0e-5
    betas: [0.9, 0.999]
    weight_decay: 1.0e-4
    lr_scheduler: constant
    lr_warmup_steps: 0
  loop:
    max_train_steps: 400
    gradient_accumulation_steps: 1
  checkpoint:
    output_dir: outputs/h3_perflow/8gpu_full
    training_state_checkpointing_steps: 20
    checkpoints_total_limit: 21
  tracker:
    project_name: fasth3-perflow
    run_name: h3-perflow-8gpu-full
  model:
    precondition_outputs: false
    enable_gradient_checkpointing_type: full
  vsa_sparsity: 0.9
  vsa_cache_tile_buf: false
  model_path: artifacts/rvm_h3/models/fasth3
  dit_precision: bf16

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
pipeline: {}
