# Actual multi-minibatch GRPO baseline for AnyFlow-Wan.
#
# Online optimization uses audited VideoAlign MQ only. VideoAlign VQ and TA are
# held-out validation metrics; they never enter the training loss.
#
# One outer rollout iteration:
#   4 prompt groups x 8 candidate trajectories = 32 terminal MQ scores
#   4 stochastic local-ASFMC transitions per trajectory
#   2 policy epochs x 4 one-group minibatches = up to 8 optimizer steps
#
# Unlike the v2 arm, later minibatches are evaluated after earlier optimizer
# updates, so pi_theta / pi_old is no longer identically one and clipping is real.

models:
  student:
    _target_: fastvideo.train.models.wan.WanModel
    init_from: nvidia/AnyFlow-Wan2.1-T2V-1.3B-Diffusers
    trainable: true
    flow_shift: 5.0
    lora:
      enable: true
      rank: 64
      alpha: 128
      target_modules:
        - to_q
        - to_k
        - to_v
        - to_out
        - ffn.fc_in
        - ffn.fc_out

method:
  _target_: fastvideo.train.methods.rl.finite_transition_grpo_v3.FiniteTransitionGRPOV3Method
  objective: flowmap_grpo
  v2_objective: flowmap_grpo

  require_train_eval_schedule_match: false
  train_map_steps: 5
  eval_map_steps: 4
  stochastic_steps: 4
  transition_mode: all
  group_size: 8
  rollout_groups_per_update: 4
  behavior_policy: on_policy

  anchor_type: local
  local_anchor_delta: 0.03
  local_noise_scale: 0.7
  local_terminal_base_sigma: 0.05
  flow_shift: 5.0
  attn_kind: dense

  # Actual PPO/GRPO optimization of a frozen rollout buffer.
  policy_epochs: 2
  groups_per_minibatch: 1
  minimum_group_reward_std: 0.0001
  clip_range: 0.02
  policy_kl_target: 0.00003
  policy_kl_early_stop_multiplier: 4.0
  old_logprob_tolerance: 0.002

  # Disabled for the first baseline because v2 showed no quality collapse and
  # the immediate failure was lack of learning. Set to 0.004 only as a named
  # follow-up if VQ/motion degradation appears.
  reference_kl_beta: 0.0

  # Every five outer iterations, score the same rollout state before and after
  # optimization using the deployed deterministic four-step map.
  deployment_probe_every: 5

  advantage_clip: 5.0
  advantage_epsilon: 0.0001
  max_grad_norm: 1.0
  terminal_progress: true

  # Parent-v2 fields retained for checkpoint/config compatibility; GRPO v3 uses
  # per-prompt group normalization rather than pooled cross-prompt scaling.
  reward_std_decay: 0.95
  reward_std_floor: 0.05
  initial_reward_std: 0.25
  posterior_temperature_mode: global_std
  posterior_temperature_multiplier: 1.0
  posterior_min_temperature: 0.001
  target_ess_ratio: 0.50
  reward_bisection_steps: 40
  target_post_update_kl: 0.00003
  kl_controller_rate: 0.25
  initial_loss_scale: 1.0
  minimum_loss_scale: 0.1
  maximum_loss_scale: 100.0
  post_update_probe_every: 1

  # Training metric: MQ only.
  reward_backend: genrl
  optimize_reward: videoalign_mq_audited
  diagnostic_reward: none
  reward_fn:
    rewards:
      videoalign_mq_audited: 1.0

  # Held-out metrics: MQ, VQ, and TA.
  validation_reward_backend: genrl
  validation_reward_fn:
    rewards:
      videoalign_mq_audited: 1.0
      videoalign_vq_audited: 1.0
      videoalign_ta_audited: 1.0

  videoalign_audit:
    enabled: true
    minimum_checkpoint_numel_coverage: 0.97
    minimum_component_coverage: 0.95
    require_reward_head: true
    repeatability_tolerance: 0.000001

  validation:
    every_steps: 5
    num_steps: 4
    num_prompts: 128
    batch_size: 1
    log_samples: true
    max_samples: 8
    fps: 16
    seed: 42
    data_path:

  validate_raw_model: true
  validate_ema_model: true
  evaluation:
    samples_per_prompt: 2
    static_temporal_l1_threshold: 0.01
    primary_min_delta: 0.02
    significance_z: 1.96
    min_motion_ratio: 0.90
    min_latent_diversity_ratio: 0.80
    heldout_max_drop:
      videoalign_vq_audited: 0.02
      videoalign_ta_audited: 0.02

  ema:
    enabled: true
    decay: 0.90
    update_after_step: 0
    validation: true
  # Eight optimizer minibatches per outer rollout iteration; this updates EMA
  # approximately once per outer iteration.
  ema_update_interval: 8

training:
  distributed:
    num_gpus: 4
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 4

  data:
    data_path: data/finite_transition_grpo_v3/train/combined_parquet_dataset
    preprocessed_data_type: text_only
    dataloader_num_workers: 0
    train_batch_size: 2
    training_cfg_rate: 0.0
    seed: 42
    num_latent_t: 21
    num_height: 480
    num_width: 832
    num_frames: 81

  optimizer:
    # More optimizer steps are taken per rollout than v2, so start below the
    # least-negative v2 arm (2e-5). Clipping and analytic old-policy KL provide
    # additional trust-region diagnostics.
    learning_rate: 0.00001
    betas: [0.9, 0.999]
    weight_decay: 0.0001
    lr_scheduler: constant
    lr_warmup_steps: 0

  loop:
    # "Step" here means one fresh rollout buffer, not one optimizer step.
    # With the defaults this is up to 160 optimizer minibatch steps.
    max_train_steps: 20
    gradient_accumulation_steps: 1

  checkpoint:
    output_dir: outputs/wan_anyflow_grpo_v3
    training_state_checkpointing_steps: 5
    checkpoints_total_limit: 5
    resume_from_checkpoint:

  tracker:
    entity: adamlee00
    project_name: finite-transition-v3-wan
    run_name: anyflow_true_grpo_v3_videoalign_mq

  model:
    enable_gradient_checkpointing_type: full

pipeline:
  flow_shift: 5.0
  dit_config:
    r_embedder: true
    r_embedder_fusion: gated
    r_embedder_gate_value: 0.25
    r_embedder_deltatime_type: r
